name: coleta

on:
  schedule:
    # 09:00 UTC = 06:00 BRT, dias úteis
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Escopo nacional = milhares de páginas com 1s obrigatório entre elas, mais
    # o enriquecimento de itens: a coleta leva mais de uma hora.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      # Os dados vivem num branch órfão, fora do histórico do código. Sem
      # trazê-los para cá, o coletor acharia que não conhece nada e refaria o
      # enriquecimento inteiro, marcando todo edital como novo.
      - name: Recuperar dados da execução anterior
        run: |
          mkdir -p web/public/data
          if git fetch --depth 1 origin dados 2>/dev/null; then
            git archive FETCH_HEAD | tar -x -C web/public/data
            echo "dados anteriores: $(ls web/public/data/*.json | wc -l) arquivos"
          else
            echo "branch dados ainda não existe — primeira execução particionada"
          fi

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          workspaces: coletor

      - name: Testes do coletor
        working-directory: coletor
        run: cargo test --release

      - name: Coletar
        run: cargo run --release --manifest-path coletor/Cargo.toml

      - name: Medir a saída
        run: |
          {
            echo "### Coleta"
            echo '```'
            cat web/public/data/index.json | head -c 400
            echo
            echo '```'
            echo "| arquivo | bytes |"
            echo "|---|---|"
            du -b web/public/data/*.json | sort -rn -k1 | head -8 | awk '{print "| "$2" | "$1" |"}'
          } >> $GITHUB_STEP_SUMMARY

      # Um único commit, sempre reescrito: o arquivo de dados muda inteiro todo
      # dia, e acumular isso no histórico somaria dezenas de MB por execução.
      - name: Publicar no branch dados
        run: |
          cd web/public/data
          git init -q .
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "dados da coleta $(date -u +%Y-%m-%dT%H:%MZ)"
          git push -q --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}" HEAD:dados
          echo "publicado em https://raw.githubusercontent.com/${{ github.repository }}/dados/index.json"
