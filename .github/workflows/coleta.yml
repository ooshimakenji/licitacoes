name: coleta

on:
  schedule:
    # 09:00 UTC = 06:00 BRT, dias úteis
    - cron: "0 9 * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: coleta
  cancel-in-progress: false

jobs:
  coletar:
    runs-on: ubuntu-latest
    # Escopo nacional = 2.000+ páginas com 1s obrigatório entre elas: a coleta
    # leva mais de uma hora, não os 30 min que bastavam para uma UF só.
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          toolchain: stable
          workspaces: coletor

      - name: Testes do coletor
        working-directory: coletor
        run: cargo test --release

      - name: Coletar
        run: cargo run --release --manifest-path coletor/Cargo.toml

      # Os dois números que decidem se a saída precisa ser particionada por UF.
      - name: Medir a saída
        run: |
          arquivo=web/public/data/licitacoes.json
          echo "- bytes: $(stat -c%s $arquivo)" >> $GITHUB_STEP_SUMMARY
          echo "- registros: $(grep -o '"id":' $arquivo | wc -l)" >> $GITHUB_STEP_SUMMARY

      - name: Commitar se mudou
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet -- web/public/data; then
            echo "Sem mudanças na coleta."
          else
            git add web/public/data
            git commit -m "chore(coleta): atualiza licitacoes.json"
            # rebase antes: se alguém empurrou algo entre o checkout e agora,
            # o push seria rejeitado e a coleta do dia se perderia
            git pull --rebase --autostash
            git push
          fi
