[package]
name = "coletor"
version = "0.1.0"
edition = "2021"

[dependencies]
ureq = { version = "2.10", features = ["json"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
time = { version = "0.3", features = ["formatting", "parsing", "macros"] }
# Já vinha no lock como dependência do ureq; declarada aqui para gravar .json.gz
# (mede 93% de redução nestes dados, testado antes de planejar em cima).
flate2 = "1"
